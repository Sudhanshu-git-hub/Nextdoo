name: Quality and integrity
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextdoo_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nextdoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nextdoo_test
      AUTH_SECRET: ci-only-isolated-test-secret-not-for-production
      APP_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nextdoo/web exec playwright install --with-deps chromium
      # The attachment E2E suite drives the REAL ClamAV engine end to end and
      # fails closed without it (no mocked scanner, no skip). Install the
      # engine + fresh signature database before any test step.
      - name: Install ClamAV (real malware engine for attachment E2E)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          freshclam || (sleep 15 && freshclam)
      - name: Verify ClamAV detects the EICAR test file
        run: |
          clamscan --version
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/nextdoo-eicar.txt
          clamscan /tmp/nextdoo-eicar.txt > /tmp/nextdoo-eicar-scan.log 2>&1
          code=$?
          cat /tmp/nextdoo-eicar-scan.log
          test "$code" -eq 1
      - run: pnpm audit --audit-level high
      - run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # --retries=2: one non-deterministic browser test (task-virtualization
      # focus-pinning, M4) intermittently fails on slow CI runners while
      # passing in every local run and on at least one full CI run of each
      # commit (see docs/M6_ENTITLEMENTS_EXPORT_MILESTONE.md, CI section).
      # Retries do not weaken any assertion: a genuinely broken test still
      # fails the run after both attempts.
      - run: pnpm --filter @nextdoo/web exec playwright test --retries=2
      - name: Surface failed E2E tests as annotations
        if: failure()
        run: node .github/scripts/e2e-failures-annotations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
